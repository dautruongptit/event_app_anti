name: event_app
description: Event Reminder App - Nhac Su Kien
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  go_router: ^14.0.0
  intl: ^0.20.2
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  badges: ^3.1.2
  flutter_animate: ^4.5.0
  google_sign_in: ^6.2.1
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# App icon Nino — xuất từ đúng hình NinoLogo (xem
# test/_tools/generate_icons_test.dart, chạy 1 lần rồi xoá). Chạy:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF5A5F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
